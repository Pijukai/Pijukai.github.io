<script>
{ // block scope: this page can run again when revisited without a reload (assets/router.js)
  document.querySelector('.yr').textContent = new Date().getFullYear();
  // each chapter fades in as it scrolls into view
  const chapters = document.querySelectorAll('.chapter');
  if ('IntersectionObserver' in window && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const io = new IntersectionObserver(entries => entries.forEach(e => {
      if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
    }), { rootMargin: '0px 0px -12% 0px' });
    chapters.forEach(c => { c.classList.add('reveal'); io.observe(c); });
    document.addEventListener('page:leave', () => io.disconnect(), { once: true });
  }
}
</script>
